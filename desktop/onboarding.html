<section id="zyra-onboarding" class="setup-card" hidden>
  <div class="setup-kicker">FIRST RUN</div>
  <h2>Set up ZYRA AI</h2>
  <p>ZYRA will verify the local runtime before you enter the main workspace.</p>

  <div class="setup-checks">
    <div class="setup-check" data-check="backend"><span>Backend</span><strong>Checking…</strong></div>
    <div class="setup-check" data-check="python"><span>Python</span><strong>Checking…</strong></div>
    <div class="setup-check" data-check="voice"><span>Voice</span><strong>Optional</strong></div>
  </div>

  <div class="setup-actions">
    <button id="zyra-setup-recheck" type="button">Recheck</button>
    <button id="zyra-setup-continue" type="button" disabled>Continue to ZYRA</button>
  </div>

  <p id="zyra-setup-message" role="status"></p>
</section>
