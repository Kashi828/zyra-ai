name: ZYRA AI Beta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test and backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Python compile
        run: python -m compileall -q .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
      - name: Install npm dependencies
        run: npm install
      - name: Electron syntax
        shell: pwsh
        run: |
          node --check electron/main.js
          node --check electron/preload.js
      - name: Windows beta installer
        run: npm run bundle:win-runtime; npx electron-builder --win nsis --x64 --publish never
      - name: Bundled backend smoke test
        shell: pwsh
        run: |
          $dbDir = Join-Path $env:RUNNER_TEMP "zyra-smoke-data"
          New-Item -ItemType Directory -Force $dbDir | Out-Null
          $env:ZYRA_DB_PATH = Join-Path $dbDir "zyra_security.sqlite3"
          $backend = Join-Path $PWD "runtime\zyra-backend\zyra-backend.exe"
          if (-not (Test-Path $backend)) { throw "Bundled backend executable missing: $backend" }
          $proc = Start-Process -FilePath $backend -WorkingDirectory $dbDir -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2
                if ($response.ok -eq $true) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "Bundled backend exited with code $($proc.ExitCode) before becoming healthy." }
            }
            if (-not $ready) { throw "Bundled backend did not become healthy on 127.0.0.1:8000." }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: zyra-windows-beta
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Android beta APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zyra-android-beta
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
