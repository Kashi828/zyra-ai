name: ZYRA AI Beta Release

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
          python -m pip install pytest pyinstaller
      - name: Python regression tests
        run: python -m pytest -q
      - name: Install npm dependencies
        run: npm install
      - name: Build self-contained Windows beta
        run: npm run bundle:win-runtime; npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test bundled backend
        shell: pwsh
        run: |
          $dbDir = Join-Path $env:RUNNER_TEMP "zyra-smoke-data"
          New-Item -ItemType Directory -Force $dbDir | Out-Null
          $env:ZYRA_DB_PATH = Join-Path $dbDir "zyra_security.sqlite3"
          $backend = Join-Path $PWD "runtime\zyra-backend\zyra-backend.exe"
          if (-not (Test-Path $backend)) { throw "Bundled backend executable missing: $backend" }
          $proc = Start-Process -FilePath $backend -WorkingDirectory $dbDir -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2
                if ($response.ok -eq $true) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "Bundled backend exited with code $($proc.ExitCode) before becoming healthy." }
            }
            if (-not $ready) { throw "Bundled backend did not become healthy on 127.0.0.1:8000." }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Generate Windows asset manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\*.exe release-assets\
          python scripts\release_manifest.py release-assets release-assets\release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: zyra-windows-beta
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Android beta APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate Android asset manifest
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/*.apk release-assets/
          python scripts/release_manifest.py release-assets release-assets/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: zyra-android-beta
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zyra-windows-beta
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: zyra-android-beta
          path: release-assets/android
      - name: Read beta version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < release/beta-version.txt)" >> "$GITHUB_OUTPUT"
      - name: Build release manifest
        shell: bash
        run: |
          mkdir -p release-assets/publish
          find release-assets/windows release-assets/android -maxdepth 1 -type f ! -name 'release-manifest.json' -exec cp {} release-assets/publish/ \;
          python scripts/release_manifest.py release-assets/publish release-assets/publish/release-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('release-assets/publish/release-manifest.json').read_text(encoding='utf-8'))
          provenance = {
              'version': '${{ steps.version.outputs.version }}',
              'source_commit': '${GITHUB_SHA}',
              'workflow_run': '${GITHUB_RUN_ID}',
              'assets': manifest['assets'],
          }
          Path('release-assets/publish/release-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Generate Windows provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: release-assets/publish/*.exe
      - name: Generate Android provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: release-assets/publish/*.apk
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/publish/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-assets/publish/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZYRA AI $TAG" \
              --prerelease \
              --generate-notes
          fi
